<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="misa.lol profile editor - manage your identity and links.">
  <title>{% block title %}misa.lol — Profile Editor{% endblock %}</title>
  
  <!-- Modern Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="/static/css/style.css">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="/" class="brand-logo" aria-label="misa.lol Home">
        <span class="logo-dot"></span>
        <span class="logo-text">misa<strong>.lol</strong></span>
      </a>
      <span class="badge-tag">Developer Assessment</span>
    </div>
  </header>

  <main class="main-container" id="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer">
    <div class="footer-container">
      <p>misa.lol profile editor trial &bull; FastAPI + SQLModel + Jinja2</p>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
